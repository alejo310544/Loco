name: Compilar Stream1 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "stream1.zip"
      - ".github/workflows/main.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: |
          sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Comprobar y descomprimir stream1.zip
        shell: bash
        run: |
          if [ ! -f "stream1.zip" ]; then
            echo "::error::No se encontró stream1.zip en la raíz."
            exit 1
          fi

          mkdir -p stream1_source
          unzip -o stream1.zip -d stream1_source

          echo "Contenido del ZIP:"
          ls -la stream1_source

      - name: Compilar APK
        shell: bash
        run: |
          cd stream1_source

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          elif [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            gradle assembleDebug --no-daemon
          else
            echo "::error::No se encontró el proyecto Gradle en la raíz del ZIP."
            exit 1
          fi

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Stream1-APK
          path: stream1_source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
