name: Compilar Stream1 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Stream1M.zip"
      - ".github/workflows/main.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK existente
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::No se encontró Android SDK en $SDK_ROOT"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::No se encontró sdkmanager."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verificar y descomprimir Stream1M.zip
        shell: bash
        run: |
          if [ ! -f "Stream1M.zip" ]; then
            echo "::error::No existe Stream1M.zip en la raíz del repositorio."
            exit 1
          fi

          mkdir -p stream1_source
          unzip -o Stream1M.zip -d stream1_source

          echo "Archivos extraídos:"
          ls -la stream1_source

      - name: Localizar proyecto Android
        shell: bash
        run: |
          PROJECT_DIR="stream1_source"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then

            SETTINGS_FILE="$(find stream1_source -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print -quit)"

            if [ -z "$SETTINGS_FILE" ]; then
              echo "::error::El ZIP no contiene settings.gradle ni settings.gradle.kts."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          echo "Proyecto: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compilar APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Stream1-APK
          path: "stream1_source/**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
